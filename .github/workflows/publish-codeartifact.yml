name: Publish To CodeArtifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
      CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
      CODEARTIFACT_REGION: ${{ vars.CODEARTIFACT_REGION }}
      CODEARTIFACT_PLUGIN_REPOSITORY: ${{ vars.CODEARTIFACT_PLUGIN_REPOSITORY }}
      CODEARTIFACT_MAVEN_REPOSITORY: ${{ vars.CODEARTIFACT_MAVEN_REPOSITORY }}
      CODEARTIFACT_USERNAME: aws
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.CODEARTIFACT_REGION }}

      - name: Get CodeArtifact authorization token
        shell: bash
        run: |
          token=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)
          echo "CODEARTIFACT_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish modules
        run: ./gradlew --no-daemon publish
